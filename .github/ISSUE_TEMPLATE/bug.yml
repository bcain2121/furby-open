name: Bug report
description: Report a reproducible Furby Open problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include tokens, API keys, private prompts, conversations, personal data, or unredacted logs.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Node version
      placeholder: Ubuntu 24.04, Node 24.16.0
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Sanitized doctor/test output
      description: Redact paths, IDs, usernames, and credentials.

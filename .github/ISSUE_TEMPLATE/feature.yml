name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and privacy impact
      description: Describe required data, network, filesystem, account, or package access.
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Best implementation layer
      options:
        - Project-local Pi skill
        - Furby Open core
        - Documentation only
        - Unsure

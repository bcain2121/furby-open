name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24']
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Public-data safety check
        run: npm run check:public
      - name: Type check
        run: npm run build
      - name: Test
        run: npm test
      - name: Report production dependency advisories
        run: npm audit --omit=dev || true
      - name: Block critical production advisories
        run: npm audit --omit=dev --audit-level=critical
